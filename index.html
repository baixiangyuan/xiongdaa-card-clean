
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>bxy</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 多主题系统 ===== */
        :root {
            --glass-bg: rgba(15, 20, 35, 0.45);
            --glass-border: rgba(120, 200, 255, 0.15);
            --glass-shadow: 0 15px 40px rgba(0, 20, 60, 0.4);
            --glass-blur: blur(24px) saturate(160%);
            --text-main: #e8f0ff;
            --text-muted: rgba(200, 220, 255, 0.7);
            --theme-accent: #6ee7b7;
            --theme-accent2: #60a5fa;
            --theme-glow: rgba(110, 231, 183, 0.3);
            --card-radius: 24px;
            --body-bg: linear-gradient(135deg, #0a0e1a 0%, #0d1b2a 40%, #1b2838 100%);
            --overlay-bg: radial-gradient(ellipse at 30% 20%, rgba(110,231,183,0.08) 0%, transparent 50%), radial-gradient(ellipse at 70% 80%, rgba(96,165,250,0.06) 0%, transparent 50%), radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: var(--body-bg); background-attachment: fixed;
            color: var(--text-main); padding: 20px; overflow-x: hidden;
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            z-index: 1; transition: background 0.8s ease;
        }

        #ambient-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; opacity: 0.5;
        }

        .layout-container {
            position: relative; z-index: 10;
            display: grid; grid-template-columns: 320px minmax(0, 480px); gap: 25px;
            width: 100%; max-width: 840px;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .profile-card, .tools-card { min-width: 0; }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(50px) scale(0.96); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: var(--card-radius);
            box-shadow: var(--glass-shadow); position: relative;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease, border-radius 0.5s ease;
        }
        .glass-card:hover {
            box-shadow: var(--glass-shadow), 0 0 0 1px var(--theme-accent), 0 0 30px var(--theme-glow);
        }

        /* === 左侧：个人资料卡片 === */
        .profile-card { padding: 70px 30px 30px 30px; text-align: center; display: flex; flex-direction: column; }

        .avatar-wrap {
            position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 120px; border-radius: 50%; padding: 4px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.5s;
        }
        .avatar-wrap:hover { transform: translateX(-50%) rotate(360deg); }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%;
            background: #2a2a35 url('https://q1.qlogo.cn/g?b=qq&nk=3075304265&s=640') center/cover;
        }

        .name { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 2px; }

        .hitokoto-box { min-height: 45px; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px; line-height: 1.6; }
        .cursor {
            display: inline-block; width: 2px; height: 1em; vertical-align: -0.15em;
            background-color: var(--text-main); animation: blink 1s step-end infinite; margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .btn-group { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .link-btn {
            display: flex; align-items: center; padding: 12px 20px; border-radius: 50px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); text-decoration: none; transition: all 0.3s; cursor: pointer;
        }
        .link-btn .icon-box {
            width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.1);
            display: flex; justify-content: center; align-items: center; margin-right: 15px; transition: all 0.3s;
        }
        .link-btn .text { flex: 1; text-align: left; font-size: 0.95rem; font-weight: 500; }
        .link-btn .arrow { font-size: 0.8rem; color: var(--text-muted); transition: all 0.3s; }
        
        .link-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .link-btn.github:hover { border-color: rgba(255, 255, 255, 0.6); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .link-btn.qq:hover { border-color: #12b7f5; box-shadow: 0 0 15px rgba(18, 183, 245, 0.3); }
        .link-btn.qq:hover .icon-box { color: #12b7f5; }
        .link-btn.wechat:hover { border-color: #07c160; box-shadow: 0 0 15px rgba(7, 193, 96, 0.3); }
        .link-btn.wechat:hover .icon-box { color: #07c160; }
        .link-btn:hover .arrow { transform: translateX(5px); color: var(--text-main); }
        /* 不蒜子统计卡片 */
        .busuanzi-card {
            display: flex; align-items: center; justify-content: center; gap: 20px;
            padding: 14px 20px; border-radius: 50px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .busuanzi-card:hover { background: rgba(255, 255, 255, 0.12); }
        .busuanzi-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.85rem; color: var(--text-muted);
        }
        .busuanzi-item .icon { font-size: 1rem; }
        .busuanzi-item .num {
            font-weight: 700; color: var(--text-main); font-size: 0.95rem;
            min-width: 32px; text-align: center;
        }
        .uptime-card {
            display: flex; align-items: center; justify-content: center; gap: 20px;
            padding: 10px 20px; border-radius: 50px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }
        .uptime-card:hover { background: rgba(255, 255, 255, 0.12); }
        .uptime-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.85rem; color: var(--text-muted);
        }
        .uptime-item .icon { font-size: 1rem; }
        .uptime-item .num {
            font-weight: 700; color: var(--text-main); font-size: 0.95rem;
            min-width: 32px; text-align: center;
        }
        /* === 右侧：工具与音乐卡片 === */
        .tools-card { padding: 30px; display: flex; flex-direction: column; gap: 20px; }

        .clock-area { text-align: center; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .clock-time { font-size: 3.5rem; font-weight: 700; line-height: 1; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 5px; }
        .clock-date { font-size: 0.95rem; color: var(--text-muted); }

        /* 天气小组件 */
        .weather-widget {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            padding: 15px; margin-top: 15px;
            background: rgba(255,255,255,0.05); border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .weather-widget:hover { background: rgba(255,255,255,0.1); }
        .weather-icon { font-size: 2.5rem; color: var(--theme-accent); }
        .weather-info { text-align: left; }
        .weather-temp { font-size: 1.8rem; font-weight: 700; line-height: 1; }
        .weather-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .weather-city { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .weather-loading { color: var(--text-muted); font-size: 0.9rem; }

        /* 音乐律动效果 */
        body.music-pulse .overlay {
            transition: background 0.1s ease-out;
        }
        body.music-pulse .glass-card {
            transition: box-shadow 0.1s ease-out, transform 0.1s ease-out;
        }

        /* 点击特效 */
        .click-effect {
            position: fixed; pointer-events: none; z-index: 9999;
            border-radius: 50%;
            animation: clickRipple 0.6s ease-out forwards;
        }
        @keyframes clickRipple {
            0% { width: 0; height: 0; opacity: 0.5; border: 2px solid var(--theme-accent); }
            100% { width: 120px; height: 120px; opacity: 0; border: 2px solid transparent; }
        }
        .click-heart {
            position: fixed; pointer-events: none; z-index: 9999;
            font-size: 20px; color: #ff6b9d;
            animation: heartFloat 1.2s ease-out forwards;
        }
        @keyframes heartFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.5); }
        }
        .click-particle {
            position: fixed; pointer-events: none; z-index: 9999;
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--theme-accent);
            animation: particleExplode 0.8s ease-out forwards;
        }
        @keyframes particleExplode {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        /* 手搓定制拟态播放器 */
        .custom-player {
            display: flex; align-items: center; gap: 12px;
            background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 15px; box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
        }

        .vinyl-record {
            width: 75px; height: 75px; border-radius: 50%;
            background: #111; border: 2px solid rgba(255,255,255,0.15);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            position: relative;
            animation: spin 5s linear infinite;
            animation-play-state: paused;
        }
        .vinyl-record.playing { animation-play-state: running; }
        .vinyl-record::after {
            content: ''; position: absolute;
            width: 14px; height: 14px; background: #222;
            border-radius: 50%; border: 1px solid rgba(0,0,0,0.8);
        }

        .album-cover {
            width: 50px; height: 50px; border-radius: 50%;
            object-fit: cover; z-index: 0; background-color: #333;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .player-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .player-title { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
        .player-artist { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-bar-container {
            width: 100%; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin-bottom: 10px; cursor: pointer; position: relative;
        }
        .progress-fill {
            height: 100%; width: 0%; background: var(--theme-accent);
            border-radius: 2px; transition: width 0.1s linear; position: relative;
        }
        .progress-fill::after {
            content: ''; position: absolute; right: -4px; top: -3px;
            width: 10px; height: 10px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.2s;
        }
        .progress-bar-container:hover .progress-fill::after { opacity: 1; }

        .player-controls { display: flex; align-items: center; gap: 15px; }
        .control-btn {
            background: none; border: none; color: var(--text-main);
            font-size: 1.1rem; cursor: pointer; transition: all 0.2s;
        }
        .control-btn:hover { color: var(--theme-accent); transform: scale(1.1); }
        .control-btn.play-pause {
            width: 35px; height: 35px; border-radius: 50%;
            background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center;
        }
        .control-btn.play-pause:hover { background: rgba(255,255,255,0.2); }

        .search-box { display: flex; gap: 10px; }
        .search-box input {
            flex: 1; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 10px 15px; border-radius: 12px; outline: none; transition: all 0.3s;
        }
        .search-box input:focus { border-color: var(--theme-accent); background: rgba(255, 255, 255, 0.15); }
        
        .action-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .action-btns button {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff; padding: 8px; border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 0.85rem;
        }
        .action-btns button:hover { background: rgba(255, 255, 255, 0.2); }

        .music-list {
            flex: 1; background: rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 10px;
            overflow-y: auto; max-height: 180px; border: 1px solid rgba(255,255,255,0.05);
        }
        .music-list::-webkit-scrollbar { width: 6px; }
        .music-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        .music-item {
            display: flex; align-items: center; padding: 10px; border-radius: 8px; cursor: pointer;
            transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .music-item.active { background: rgba(165, 180, 252, 0.15); border-color: var(--theme-accent); }
        .music-item:hover { background: rgba(255, 255, 255, 0.1); }
        .music-item .play-icon { width: 30px; color: var(--theme-accent); font-size: 0.9rem; }
        .music-item .music-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .music-item .music-name { font-size: 0.9rem; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .music-item .music-artist { font-size: 0.75rem; color: var(--text-muted); }
        .music-item .music-duration { font-size: 0.75rem; color: var(--text-muted); margin-right: 12px; font-family: monospace; }
        .music-item .source-tag { font-size: 0.7rem; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 50px; white-space: nowrap; }

        /* 播放历史面板 */
        #history-panel {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.4s ease;
            background: rgba(0, 0, 0, 0.25); border-radius: 16px; border: 0px solid rgba(255,255,255,0.1);
        }
        #history-panel.show {
            max-height: 300px; padding: 15px; border-width: 1px;
        }
        .history-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-bottom: 1px dashed rgba(255,255,255,0.1);
            transition: background 0.2s; border-radius: 6px;
        }
        .history-item:hover { background: rgba(255,255,255,0.05); }
        .history-info { flex: 1; overflow: hidden; }
        .history-name { font-size: 0.85rem; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
        .history-artist { font-size: 0.7rem; color: var(--text-muted); }
        .history-time { font-size: 0.65rem; color: rgba(255,255,255,0.4); }
 .history-delete { color: #ff4757; cursor: pointer; font-size: 0.8rem; padding: 2px 6px; }
 .history-delete:hover { color: #ff6b6b; }
 .history-empty { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.85rem; }

 /* === 作者生平弹窗 === */
 #bio-modal {
 position: fixed; top: 0; left: 0; width: 100%; height: 100%;
 z-index: 9998; display: none; justify-content: center; align-items: center;
 animation: slideUpFade 0.3s forwards;
 }
 #bio-modal.show { display: flex; }
 #bio-modal-backdrop {
 position: absolute; top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(0,0,0,0.5); z-index: 1;
 }
 #bio-panel {
 position: relative; z-index: 2;
 width: 90%; max-width: 520px; max-height: 80vh;
 background: rgba(15, 15, 20, 0.65);
 backdrop-filter: blur(28px) saturate(160%);
 -webkit-backdrop-filter: blur(28px) saturate(160%);
 border: 1px solid var(--glass-border);
 border-radius: 24px; box-shadow: var(--glass-shadow);
 display: flex; flex-direction: column;
 animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
 }
 .bio-header {
 padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.1);
 display: flex; justify-content: space-between; align-items: center;
 font-size: 1rem; font-weight: 500; flex-shrink: 0;
 }
 .bio-header i.fa-times {
 cursor: pointer; color: rgba(255,255,255,0.5); transition: color 0.2s; font-size: 1.1rem;
 }
 .bio-header i.fa-times:hover { color: #ff4757; }
 .bio-body {
 padding: 24px; overflow-y: auto; flex: 1;
 }
 .bio-body::-webkit-scrollbar { width: 5px; }
 .bio-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

 /* 作者头像区域 */
 .bio-avatar-section {
 text-align: center; margin-bottom: 20px;
 }
 .bio-avatar {
 width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 12px;
 background: #2a2a35; border: 2px solid var(--glass-border);
 object-fit: cover; display: block;
 }
 .bio-name { font-size: 1.4rem; font-weight: 700; }
 .bio-aka { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
 .bio-motto {
 font-size: 0.85rem; color: var(--theme-accent); margin-top: 8px;
 padding: 8px 16px; background: rgba(255,255,255,0.08);
 border-radius: 50px; display: inline-block; border: 1px solid rgba(255,255,255,0.15);
 }
 .bio-quote {
 font-size: 0.85rem; color: var(--text-muted); font-style: italic; margin-top: 15px;
 padding: 12px 16px; background: rgba(0,0,0,0.15); border-radius: 12px;
 border-left: 3px solid var(--theme-accent); line-height: 1.6;
 }
 .bio-section {
 margin-top: 20px; padding-top: 18px;
 border-top: 1px solid rgba(255,255,255,0.06);
 }
 .bio-section-title {
 font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;
 font-weight: 500; letter-spacing: 1px;
 }
 .bio-section-title i { color: var(--theme-accent); margin-right: 6px; }

 /* 技能条 */
 .bio-skills { display: flex; flex-direction: column; gap: 10px; }
 .bio-skill-item { display: flex; align-items: center; gap: 12px; }
 .bio-skill-icon {
 width: 28px; text-align: center; color: var(--theme-accent); font-size: 0.9rem;
 }
 .bio-skill-name { width: 100px; font-size: 0.85rem; color: var(--text-main); flex-shrink: 0; }
 .bio-skill-bar {
 flex: 1; height: 6px; background: rgba(255,255,255,0.08);
 border-radius: 3px; overflow: hidden;
 }
 .bio-skill-fill {
 height: 100%; border-radius: 3px;
 background: linear-gradient(90deg, var(--theme-accent), #818cf8);
 transition: width 0.8s ease; width: 0;
 }
 .bio-skill-level {
 width: 36px; text-align: right; font-size: 0.75rem;
 color: var(--text-muted); font-family: monospace;
 }

 /* 时间线 */
 .bio-timeline { position: relative; padding-left: 24px; }
 .bio-timeline::before {
 content: ''; position: absolute; left: 7px; top: 0; bottom: 0;
 width: 2px; background: rgba(255,255,255,0.25);
 }
 .bio-timeline-item { position: relative; padding-bottom: 16px; }
 .bio-timeline-item:last-child { padding-bottom: 0; }
 .bio-timeline-item::before {
 content: ''; position: absolute; left: -21px; top: 5px;
 width: 10px; height: 10px; border-radius: 50%;
 background: var(--theme-accent); border: 2px solid rgba(15,15,20,0.8);
 }
 .bio-timeline-year { font-size: 0.75rem; color: var(--theme-accent); font-weight: 600; font-family: monospace; }
 .bio-timeline-event { font-size: 0.85rem; color: var(--text-main); margin-top: 2px; line-height: 1.4; }

 /* 项目卡片 */
 .bio-projects { display: flex; flex-direction: column; gap: 10px; }
 .bio-project {
 padding: 12px 16px; background: rgba(255,255,255,0.04);
 border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;
 transition: all 0.2s;
 }
 .bio-project:hover { background: rgba(255,255,255,0.08); border-color: var(--theme-accent); }
 .bio-project a {
 color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.9rem;
 }
 .bio-project a:hover { color: var(--theme-accent); }
 .bio-project-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
 .bio-project-lang {
 display: inline-block; margin-top: 6px; font-size: 0.7rem;
 background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 50px;
 color: var(--theme-accent);
 }

 /* 标签 */
 .bio-tags { display: flex; flex-wrap: wrap; gap: 6px; }
 .bio-tag {
 font-size: 0.75rem; padding: 4px 12px; border-radius: 50px;
 background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
 color: var(--text-muted);
 }
 .bio-tag:hover { background: rgba(255,255,255,0.1); }

 /* 联系信息 */
 .bio-contact { display: flex; flex-wrap: wrap; gap: 8px; }

        @media (hover: hover) and (pointer: fine) {
        * { cursor: none !important; }
        }
        @media (hover: none), (pointer: coarse) {
            #cursor-concentric, #cursor-trail-canvas { display: none !important; }
        }
        #cursor-concentric {
            position: fixed; pointer-events: none; z-index: 999999;
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.15s ease;
        }
        #cursor-concentric.active { opacity: 1; }
        #cursor-concentric .outer {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            border: 2.5px solid #ffffff;
            box-shadow: 0 0 12px rgba(255,255,255,0.4), inset 0 0 8px rgba(255,255,255,0.1);
            animation: cursorPulse 2s ease-in-out infinite;
        }
        @keyframes cursorPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        #cursor-concentric .inner {
            position: absolute; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.7);
            box-shadow: 0 0 8px rgba(255,255,255,0.3), inset 0 0 6px rgba(255,255,255,0.15);
            animation: innerPulse 2s ease-in-out infinite;
        }
        @keyframes innerPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        #cursor-concentric .dot {
            position: absolute; width: 5px; height: 5px; border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px rgba(255,255,255,0.3);
        }
        #cursor-concentric.click .outer {
            animation: clickRipple 0.5s ease-out forwards !important;
        }
        @keyframes clickRipple {
            0% { transform: scale(1); opacity: 0.8; border-width: 2.5px; }
            100% { transform: scale(2.5); opacity: 0; border-width: 1px; }
        }
        @keyframes trailRing {
            0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.3); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
        }
        @keyframes trailDot {

        }.theme-switcher-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.1); }.theme-panel.show { display: flex; }.theme-option:hover { background: rgba(255,255,255,0.1); color: #fff; }
